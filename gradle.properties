#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# configuration setting in Gradle that enables parallel execution of tasks during a build.
org.gradle.parallel=true

# cache gradle configuration in parallel, but might need to further test if your project supports
org.gradle.configuration-cache.parallel=true

# might need to further test if your project supports
org.gradle.configuration-cache.read-only=true

org.gradle.logging.level=info